<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Healthy Bites</title>

    {% load static %}

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <style>

        body{
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg,#f3fff6,#e6f5ec);
            min-height:100vh;
        }

        .main-container{
            max-width:1100px;
            margin:auto;
        }

        .navbar{
            border-radius:12px;
        }

        .recipes-container{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
            gap:25px;
        }

        .recipe-card{
            background:white;
            border-radius:18px;
            padding:20px;
            box-shadow:0 10px 20px rgba(0,0,0,0.08);
            transition:all 0.3s ease;
            position:relative;
            overflow:hidden;
        }

        .recipe-card:hover{
            transform:translateY(-8px) scale(1.03);
            box-shadow:0 18px 35px rgba(0,0,0,0.15);
        }

        .recipe-card::before{
            content:"";
            position:absolute;
            top:0;
            left:-120%;
            width:120%;
            height:100%;
            background:linear-gradient(
                120deg,
                transparent,
                rgba(255,255,255,0.4),
                transparent
            );
            transition:0.5s;
        }

        .recipe-card:hover::before{
            left:120%;
        }

    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm mb-4">
    <div class="container">

        <a class="navbar-brand d-flex align-items-center" href="{% url 'home' %}">
            <img src="{% static 'planner/images/healthy-bite-logo.jpg' %}"
                 alt="Healthy Bites Logo"
                 width="70"
                 height="70"
                 class="me-2">

            <span class="fw-bold text-success">
                Healthy Bites
            </span>
        </a>

        
        <form class="d-flex align-items-center me-3"
              method="get"
              action="{% url 'recipes:search' %}"
              style="max-width: 420px; width: 100%;">
            <input class="form-control form-control-sm me-2"
                   type="search"
                   name="q"
                   placeholder="Search recipes..."
                   aria-label="Search"
                   value="{{ request.GET.q|default:'' }}">
            <button class="btn btn-outline-success btn-sm" type="submit">
                Search
            </button>
        </form>

        <div>

            {% if user.is_authenticated %}

                <span class="me-3">
                    Welcome, {{ user.username }}
                </span>

                <a class="btn btn-outline-primary btn-sm me-2"
                   href="{% url 'profile' %}">
                    My Profile
                </a>

                <a class="btn btn-outline-warning btn-sm me-2"
                   href="{% url 'recipes:my_favorites' %}">
                    My Favorites
                </a>

                <form action="{% url 'logout' %}"
                      method="post"
                      class="d-inline">
                    {% csrf_token %}

                    <button type="submit"
                            class="btn btn-outline-danger btn-sm">
                        Logout
                    </button>

                </form>

            {% else %}

                <a class="btn btn-outline-success btn-sm me-2"
                   href="{% url 'login' %}">
                    Login
                </a>

                <a class="btn btn-success btn-sm"
                   href="{% url 'register' %}">
                    Register
                </a>

            {% endif %}

        </div>

    </div>
</nav>


<!-- CONTENIDO -->
<div class="container main-container">

    {% block content %}
    {% endblock %}

</div>


<!-- FOOTER -->
<footer class="text-center mt-5 mb-3 text-muted">
    <small>
        © 2026 Healthy Bites
    </small>
</footer>


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- BuilderBot Chat -->
<script
  src="https://cdn.builderbot.cloud/sdk.umd.js"
  data-builderbot-chat
  data-id="c58bfaaf-b36d-4e19-b955-e1a13ef4a3f1"
  data-company="HealthyBites"
  data-avatar-initials="HB"
  data-theme-config='{"colors":{"primary":"#6366F1","accent":"#6366F1","sendButton":"#6366F1","sendButtonHover":"#4F46E5","text":"#111827","textSecondary":"#6B7280","background":"#FFFFFF","backgroundChat":"#F9FAFB","userMessageBg":"rgba(99,102,241,0.10)","userMessageText":"#4F46E5","agentMessageBg":"#F3F4F6","agentMessageText":"#111827","border":"#E5E7EB","hover":"rgba(99,102,241,0.08)","timestamp":"#9CA3AF","icon":"#6B7280","inputBackground":"#FFFFFF","inputPlaceholder":"#9CA3AF"},"spacing":{"borderRadius":"16px","messageBorderRadius":"12px"}}'
  data-faq='["No se que comer ¿que me recomiendas?"]'
></script>

</body>
</html>
