{% extends 'base/base.html' %}
{% load static %}

{% block content %}

<div class="d-flex justify-content-center align-items-center" style="min-height:70vh;">

    <div class="card shadow-lg p-4 auth-card" style="max-width:500px; border-radius:20px;">

         <div class="text-center">
    <img src="{% static 'planner/images/Logo HB.png' %}" width="100" alt="Healthy Bites Logo">
        </div>


        <h2 class="text-center text-success mb-4">
            Complete Your Profile
        </h2>

        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit"
                    class="btn btn-success w-100 mt-3">
                Save Profile
            </button>

        </form>

    </div>

</div>

{% endblock %}
