<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Healthy Bites</title>

    {% load static %}

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <style>

        body{
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg,#f3fff6,#e6f5ec);
            min-height:100vh;
        }

        .main-container{
            max-width:1100px;
            margin:auto;
        }

        .navbar{
            border-radius:12px;
        }

        .recipes-container{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
            gap:25px;
        }

        .recipe-card{
            background:white;
            border-radius:18px;
            padding:20px;
            box-shadow:0 10px 20px rgba(0,0,0,0.08);
            transition:all 0.3s ease;
            position:relative;
            overflow:hidden;
        }

        .recipe-card:hover{
            transform:translateY(-8px) scale(1.03);
            box-shadow:0 18px 35px rgba(0,0,0,0.15);
        }

        .recipe-card::before{
            content:"";
            position:absolute;
            top:0;
            left:-120%;
            width:120%;
            height:100%;
            background:linear-gradient(
                120deg,
                transparent,
                rgba(255,255,255,0.4),
                transparent
            );
            transition:0.5s;
        }

        .recipe-card:hover::before{
            left:120%;
        }

    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm mb-4">
    <div class="container">

        <a class="navbar-brand d-flex align-items-center" href="{% url 'home' %}">
            <img src="{% static 'planner/images/LogoHB.jpeg' %}"
                 alt="Healthy Bites Logo"
                 width="70"
                 height="70"
                 class="me-2">

            <span class="fw-bold text-success">
                Healthy Bites
            </span>
        </a>

        <div>

            {% if user.is_authenticated %}

                <span class="me-3">
                    Welcome, {{ user.username }}
                </span>

                <a class="btn btn-outline-primary btn-sm me-2"
                   href="{% url 'profile' %}">
                    My Profile
                </a>

                <a class="btn btn-outline-warning btn-sm me-2"
                   href="{% url 'my_favorites' %}">
                    My Favorites
                </a>

                <form action="{% url 'logout' %}"
                      method="post"
                      class="d-inline">
                    {% csrf_token %}

                    <button type="submit"
                            class="btn btn-outline-danger btn-sm">
                        Logout
                    </button>

                </form>

            {% else %}

                <a class="btn btn-outline-success btn-sm me-2"
                   href="{% url 'login' %}">
                    Login
                </a>

                <a class="btn btn-success btn-sm"
                   href="{% url 'register' %}">
                    Register
                </a>

            {% endif %}

        </div>

    </div>
</nav>


<!-- CONTENIDO -->
<div class="container main-container">

    {% block content %}
    {% endblock %}

</div>


<!-- FOOTER -->
<footer class="text-center mt-5 mb-3 text-muted">
    <small>
        © 2026 Healthy Bites
    </small>
</footer>


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
