<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Healthy Bites</title>

    {% load static %}

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="{% url 'home' %}">
            <img src="{% static 'planner/images/logo.png' %}"
                alt="Healthy Bites Logo"
                width="40"
                height="40"
                class="me-2">
            <span class="fw-bold">Healthy Bites</span>
        </a>

        <div>
            {% if user.is_authenticated %} <!--si el usuario esta autenticado-->

                <span class="me-3">
                    Welcome, {{ user.username }}
                </span>

                <a class="btn btn-outline-primary btn-sm me-2"
                   href="{% url 'profile' %}">
                    My Profile
                </a>

                <a class="btn btn-outline-warning btn-sm me-2"
                   href="{% url 'my_favorites' %}">
                    My Favorites
                </a>

                <!-- Logout seguro vía POST -->
                <form action="{% url 'logout' %}"
                      method="post"
                      class="d-inline">
                    {% csrf_token %}
                    <button type="submit"
                            class="btn btn-outline-danger btn-sm">
                        Logout
                    </button>
                </form>

            {% else %}

                <a class="btn btn-outline-success btn-sm me-2"
                   href="{% url 'login' %}">
                    Login
                </a>

                <a class="btn btn-success btn-sm"
                   href="{% url 'register' %}">
                    Register
                </a>

            {% endif %}
        </div>
    </div>
</nav>

<!-- Main Content -->
<div class="container">
    {% block content %}
    {% endblock %}
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
