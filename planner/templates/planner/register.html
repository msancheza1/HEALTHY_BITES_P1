{% extends 'planner/base.html' %}
{% load static %}

{% block content %}

<div class="d-flex justify-content-center align-items-center" style="min-height:70vh;">

    <div class="card shadow-lg p-4 auth-card">

        <div class="text-center">
    <img src="{% static 'planner/images/logo HB2.png' %}" width="100">
        </div>

        <h2 class="text-center mb-4 text-success">
            Create Account
        </h2>

        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit"
                    class="btn btn-success w-100 mt-3">
                Register
            </button>

        </form>

        <div class="text-center mt-3">
            <small>
                Already have an account?
                <a href="{% url 'login' %}">
                    Login
                </a>
            </small>
        </div>

    </div>

</div>

{% endblock %}
